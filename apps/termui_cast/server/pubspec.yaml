name: termui_cast_server
description: Stateless binary WebSocket relay server for TermUI PTY casting.
version: 0.4.2
publish_to: none
resolution: workspace

environment:
  sdk: ">=3.11.0 <4.0.0"

dependencies:
  args: ^2.7.0
  clock: ^1.1.3
  crypto: ^3.0.8
  path: ^1.9.1
  stream_channel: ^2.1.4
  termui_cast_protocol: ^0.4.1

dev_dependencies:
  checks: ^0.3.2
  termui: ^0.21.2
  test: ^1.26.0

executables:
  termui_cast_server: termui_cast_server
