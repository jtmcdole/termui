name: fterm
description: Flutter web and native desktop monospace terminal client and mux for TermUI PTY casting.
version: 0.3.0
publish_to: none
resolution: workspace

environment:
  sdk: ">=3.11.0 <4.0.0"
  flutter: ">=3.41.0"

dependencies:
  archive: ^4.7.1
  clock: ^1.1.2
  crypto: ^3.0.8
  ffi: ^2.2.0
  flutter:
    sdk: flutter
  material_ui: ^1.3.0
  path: ^1.9.1
  stream_channel: ^2.1.4
  termui: ^0.18.0
  termui_audio_flutter: ^0.4.1
  termui_cast_client_core: ^0.2.1
  termui_cast_protocol: ^0.2.1
  termui_caster_cli: ^0.2.1
  termui_flutter: ^0.13.1
  termui_pty: ^0.13.1
  web: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  termui_cast_server: ^0.2.1
  termui_test: ^0.4.7

flutter:
  uses-material-design: true
  assets:
    - LICENSE
    - fonts/LICENSE-MesloLGS.txt
    - fonts/OFL-CascadiaMonoPL.txt
    - web/favicon.svg
  fonts:
    - family: Cascadia Mono
      fonts:
        - asset: fonts/CascadiaMonoPL.ttf
    - family: MesloLGS NF
      fonts:
        - asset: fonts/MesloLGS_NF_Regular.ttf
