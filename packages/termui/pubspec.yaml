name: termui
description: A high-performance terminal UI and windowing system for Dart featuring overlapping windows, double buffering, layouts, and sub-pixel vector graphics.
version: 0.7.7
repository: https://github.com/jtmcdole/termui/tree/main/packages/termui

executables:
  termui_trace:

topics:
  - cli
  - tui
  - terminal
  - console
  - games

platforms:
  android:
  ios:
  linux:
  macos:
  windows:
  web:

resolution: workspace

environment:
  sdk: ">=3.11.0 <4.0.0"

dependencies:
  ansicolor: ^2.0.3
  archive: ^4.0.9
  args: ^2.7.0
  characters: ^1.4.0
  clock: ^1.1.2
  emoji_regex: ^0.0.5
  ffi: ^2.2.0
  file: ^7.0.0
  web: ^1.1.1
  path: ^1.9.0
  quiver: ^3.2.2
  win32: ^6.0.0

dev_dependencies:
  test: ">=1.24.0 <2.0.0"
  lints: ^6.0.0
  termui_shared_examples: any
  termui_recorder: any
  termui_test: any
  fake_async: ^1.3.3
  coverage: ^1.15.1
