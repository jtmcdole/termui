name: termui_recorder
description: Testing and recording utilities for termui, supporting ANSI screenshots, Asciinema v2 formats, and playbacks.
version: 0.1.0
publish_to: 'none'

resolution: workspace

environment:
  sdk: ">=3.11.0 <4.0.0"

dependencies:
  termui:
    path: ../termui
  characters: ^1.4.0
  args: ^2.7.0
  test: ">=1.24.0 <2.0.0"

dev_dependencies:
  lints: ^6.0.0
