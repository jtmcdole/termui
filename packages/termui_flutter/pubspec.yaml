name: termui_flutter
description: Flutter integration package for termui, containing the reusable Terminal widget and GPU-accelerated canvas renderer.
version: 0.6.15
repository: https://github.com/jtmcdole/termui/tree/main/packages/termui_flutter

topics:
  - cli
  - tui
  - terminal
  - console

platforms:
  android:
  ios:
  linux:
  macos:
  windows:
  web:

resolution: workspace

environment:
  sdk: ">=3.11.0 <4.0.0"
  flutter: ">=3.0.0"

dependencies:
  flutter:
    sdk: flutter
  termui: ^0.7.11
  characters: ^1.4.0
  clock: ^1.1.2
  web: ^1.1.1

dev_dependencies:
  test: ">=1.24.0 <2.0.0"
  flutter_test:
    sdk: flutter
  shared_preferences: ^2.2.0
  termui_shared_examples: any
  termui_test: ^0.2.12+15
