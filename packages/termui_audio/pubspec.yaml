name: termui_audio
description: A multiplatform low-latency game audio engine for termui (VM CLI, Flutter, Web).
version: 0.1.0

resolution: workspace

environment:
  sdk: ">=3.11.0 <4.0.0"
  flutter: ">=3.0.0"

dependencies:
  flutter:
    sdk: flutter
  termui: ^0.7.7
  ffi: ^2.2.0
  path_provider: ^2.1.5
  flutter_soloud: ^4.0.12
  web: ^1.1.1
  path: ^1.9.0
  idb_shim: any
  logging: ^1.3.0
  meta: ^1.15.0

dev_dependencies:
  test: ">=1.24.0 <2.0.0"
  native_toolchain_c: any
  native_assets_cli: any
  build_runner: any
