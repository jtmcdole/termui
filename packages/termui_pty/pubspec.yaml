name: termui_pty
description: A custom ANSI terminal emulator and PTY view for termui.
version: 0.3.15
repository: https://github.com/jtmcdole/termui/tree/main/packages/termui_pty

resolution: workspace

topics:
  - cli
  - tui
  - terminal
  - console
  - pty

platforms:
  windows:
  macos:
  linux:
  web:
  ios:
  android:

environment:
  sdk: ">=3.11.0 <4.0.0"

dependencies:
  termui: ^0.9.2
  pty2: ^0.5.4
  characters: ^1.4.0

dev_dependencies:
  test: ">=1.24.0 <2.0.0"
  termui_shared_examples: any
  termui_test: ^0.2.16
  benchmark_harness: ^2.2.0
