name: termui_tinpot
description: A high-performance pure Dart engine for converting images to ANSI terminal text using structural symbols, inspired by Chafa.
repository: https://github.com/jtmcdole/termui/tree/main/packages/termui_tinpot
version: 0.3.3

topics:
  - cli
  - terminal
  - ascii
  - image
  - chafa

environment:
  sdk: ">=3.11.0 <4.0.0"

resolution: workspace

dependencies:
  args: ^2.4.2
  image: ^4.1.7
  termui: ^0.9.2
  characters: ^1.3.0

dev_dependencies:
  test: ">=1.24.0 <2.0.0"
  lints: ^6.0.0
  clock: ^1.1.1
  file: ^7.0.0
  path: ^1.8.0
  termui_recorder: ^0.7.2
