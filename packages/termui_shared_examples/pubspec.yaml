name: termui_shared_examples
description: Shared example widgets and screens for termui and termui_flutter.
version: 0.0.1
publish_to: none

resolution: workspace

environment:
  sdk: ">=3.11.0 <4.0.0"

dependencies:
  args: ^2.7.0
  termui: ^0.9.5
  termui_recorder: ^0.7.7
  termui_pty: ^0.3.19
  pty2: ^0.5.6
  characters: ^1.4.0
  clock: ^1.1.2
  file: ^7.0.1
  core_bus: ^1.0.1

dev_dependencies:
  fake_async: ^1.3.3
  lints: ^6.0.0
  termui_test: ^0.2.21
  test: ">=1.24.0 <2.0.0"
