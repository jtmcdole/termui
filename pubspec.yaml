name: termui_monorepo
description: Root workspace of the termui monorepo.
version: 0.0.1
publish_to: 'none'

environment:
  sdk: ">=3.11.0 <4.0.0"

platforms:
  android:
  ios:
  linux:
  macos:
  windows:
  web:

topics:
  - cli
  - audio
  - terminal
  - console
  - games

workspace:
  - packages/termui
  - packages/termui_flutter
  - packages/termui_flutter/example
  - packages/termui_shared_examples
  - packages/termui_recorder
  - packages/termui_test
  - packages/termui_hotreload
  - packages/termui_hotreload/example
  - packages/pty2
  - packages/termui_pty
  - packages/termui_audio
  - packages/termui_audio/example
  - packages/termui_tinpot
  - packages/termui_tinpot/example

dev_dependencies:
  melos: ^8.1.0

melos:
  command:
    bootstrap:
      environment:
        sdk: ">=3.11.0 <4.0.0"
        flutter: ">=3.0.0"
  scripts:
    analyze:
      run: dart run melos exec -c 1 -- "dart analyze"
      description: Run static analysis on all packages.

    test:dart:
      description: Run unit tests for pure Dart packages.
      exec:
        concurrency: 1
        command: dart test --reporter=expanded
        failFast: true
      packageFilters:
        dirExists: test
        flutter: false

    test:flutter:audio:
      description: Run native audio engine tests sequentially (-j 1).
      exec:
        concurrency: 1
        command: flutter test --no-pub --reporter=expanded -j 1
        failFast: true
      packageFilters:
        scope: termui_audio

    test:flutter:packages:
      description: Run Flutter UI package tests with multi-core suite concurrency.
      exec:
        concurrency: 1
        command: flutter test --no-pub --reporter=expanded
        failFast: true
      packageFilters:
        dirExists: test
        flutter: true
        ignore: termui_audio

    test:flutter:
      description: Run unit tests for all Flutter packages.
      steps:
        - test:flutter:audio
        - test:flutter:packages

    test:all:
      steps:
        - test:dart
        - test:flutter
      packageFilters:
        dirExists: test
      description: Run all tests in the monorepo.
dependencies:
  archive: ^4.0.9
