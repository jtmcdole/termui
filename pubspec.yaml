name: termui_monorepo
description: Root workspace of the termui monorepo.
version: 0.0.1
publish_to: 'none'

environment:
  sdk: ">=3.11.0 <4.0.0"

platforms:
  android:
  ios:
  linux:
  macos:
  windows:
  web:

topics:
  - cli
  - audio
  - terminal
  - console
  - games

workspace:
  - packages/termui
  - packages/termui_flutter
  - packages/termui_flutter/example
  - packages/termui_shared_examples
  - packages/termui_recorder
  - packages/termui_test
  - packages/termui_hotreload
  - packages/termui_hotreload/example
  - packages/pty2
  - packages/termui_pty
  - packages/termui_audio
  - packages/termui_audio_flutter
  - packages/termui_audio/example
  - packages/termui_tinpot
  - packages/termui_tinpot/example
  - apps/termui_cast/protocol
  - apps/termui_cast/server
  - apps/termui_cast/caster_cli
  - apps/termui_cast/client_core
  - apps/fterm

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  melos: ^8.1.0

buildpack:
  server: apps/termui_cast/server
  static: apps/fterm
  postbuild: cd /workspace/apps/fterm && flutter build web --wasm --no-web-resources-cdn --dart-define="FTERM_BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)"

melos:
  command:
    bootstrap:
      environment:
        sdk: ">=3.11.0 <4.0.0"
        flutter: ">=3.41.0"
  scripts:
    analyze:
      run: dart run melos exec -c 1 -- "dart analyze"
      description: Run static analysis on all packages.

    test:dart:
      description: Run unit tests for pure Dart packages.
      exec:
        concurrency: 1
        command: dart test --reporter=expanded
        failFast: true
      packageFilters:
        dirExists: test
        flutter: false
        ignore:
          - termui_cast_protocol
          - termui_cast_server
          - termui_caster_cli
          - termui_cast_client_core

    test:flutter:
      description: Run unit tests for all Flutter packages.
      exec:
        concurrency: 1
        command: flutter test --no-pub --reporter=expanded
        failFast: true
      packageFilters:
        dirExists: test
        flutter: true
        ignore:
          - fterm

    test:all:
      steps:
        - test:dart
        - test:flutter
      packageFilters:
        dirExists: test
      description: Run all tests in the monorepo.
