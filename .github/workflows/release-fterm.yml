name: Release fterm

on:
  push:
    branches:
      - main
    paths:
      - 'apps/fterm/pubspec.yaml'
  workflow_dispatch:
    inputs:
      version:
        description: 'Optional version override without fterm-v prefix (defaults to apps/fterm/pubspec.yaml)'
        required: false
        default: ''
        type: string
      draft:
        description: 'Create GitHub release as a draft'
        required: false
        default: false
        type: boolean
      prerelease:
        description: 'Mark GitHub release as a prerelease (auto-enabled for pre-release versions)'
        required: false
        default: false
        type: boolean

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    name: Preflight release checks
    if: >-
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.head_commit.message, 'chore(fterm-release):')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      version: ${{ steps.meta.outputs.version }}
      build_date: ${{ steps.meta.outputs.build_date }}
      is_draft: ${{ steps.meta.outputs.is_draft }}
      is_prerelease: ${{ steps.meta.outputs.is_prerelease }}
    steps:
      - name: Checkout fterm pubspec
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            apps/fterm/pubspec.yaml

      - name: Resolve version and validate tag availability
        id: meta
        run: |
          RELEASE_VERSION="${INPUT_VERSION}"
          if [ -z "$RELEASE_VERSION" ]; then
            RELEASE_VERSION="$(sed -n 's/^version:[[:space:]]*\([^[:space:]#+]*\).*/\1/p' apps/fterm/pubspec.yaml | head -n 1)"
          fi
          if [[ ! "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Invalid version '$RELEASE_VERSION'. Expected semantic version like 0.1.0 or 0.1.0-rc.1."
            exit 1
          fi
          TAG="fterm-v${RELEASE_VERSION}"
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}" >/dev/null 2>&1; then
            echo "::error::Tag $TAG already exists."
            exit 1
          fi
          IS_DRAFT="false"
          if [ "$INPUT_DRAFT" = "true" ]; then
            IS_DRAFT="true"
          fi
          IS_PRERELEASE="false"
          if [ "$INPUT_PRERELEASE" = "true" ] || [[ "$RELEASE_VERSION" == *-* ]]; then
            IS_PRERELEASE="true"
          fi
          BUILD_DATE="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          {
            printf 'version=%s\n' "$RELEASE_VERSION"
            printf 'build_date=%s\n' "$BUILD_DATE"
            printf 'is_draft=%s\n' "$IS_DRAFT"
            printf 'is_prerelease=%s\n' "$IS_PRERELEASE"
          } >> "$GITHUB_OUTPUT"
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_DRAFT: ${{ inputs.draft }}
          INPUT_PRERELEASE: ${{ inputs.prerelease }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-web:
    name: Build web viewer (WASM)
    needs: preflight
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          cache: true

      - name: Install workspace dependencies
        run: flutter pub get

      - name: Build and package fterm-web WASM bundle
        run: |
          mkdir -p dist
          (cd apps/fterm && flutter build web --wasm --no-web-resources-cdn --build-name="$RELEASE_VERSION" --dart-define="FTERM_BUILD_DATE=$BUILD_DATE")
          ./utils/package_fterm_web.sh apps/fterm/build/web dist/fterm-web.tar.gz
        env:
          RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
          BUILD_DATE: ${{ needs.preflight.outputs.build_date }}

      - name: Upload fterm-web bundle artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fterm-web
          path: dist/fterm-web.tar.gz
          if-no-files-found: error

  build:
    name: Build (${{ matrix.target }})
    needs: [preflight, build-web]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: macos-arm64
            os: macos-latest
            archive_ext: tar.gz
            build_desktop: true
          - target: linux-x64
            os: ubuntu-22.04
            archive_ext: tar.gz
            build_desktop: true
          - target: windows-x64
            os: windows-latest
            archive_ext: zip
            build_desktop: true
          # Disabled for now: Flutter does not publish linux-arm64 release archives
          # required by subosito/flutter-action (requires cloning the SDK + fetching tools).
          # - target: linux-arm64
          #   os: ubuntu-24.04-arm
          #   archive_ext: tar.gz
          #   build_desktop: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          if [ "$BUILD_DESKTOP" = "true" ]; then
            sudo apt-get install -y --no-install-recommends clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libasound2-dev
          else
            sudo apt-get install -y --no-install-recommends libasound2-dev
          fi
        env:
          BUILD_DESKTOP: ${{ matrix.build_desktop }}

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          cache: true

      - name: Install workspace dependencies
        run: flutter pub get

      - name: Download prebuilt fterm-web WASM bundle
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: fterm-web
          path: dist

      - name: Build and package Unix bundles
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist
          if [ "$BUILD_DESKTOP" = "true" ]; then
            (cd apps/fterm && flutter build "$DESKTOP_OS" --release --build-name="$RELEASE_VERSION" --dart-define="FTERM_BUILD_DATE=$BUILD_DATE")
            FLUTTER_BIN_DIR="$(dirname "$(command -v flutter)")"
            if [ "$DESKTOP_OS" = "macos" ]; then
              IMPELLERC_SRC=""
              for arch_dir in darwin-arm64 darwin-x64; do
                candidate="${FLUTTER_BIN_DIR}/cache/artifacts/engine/${arch_dir}/impellerc"
                if [ -f "$candidate" ]; then
                  IMPELLERC_SRC="$candidate"
                  break
                fi
              done
              if [ -z "$IMPELLERC_SRC" ]; then
                echo "::error::Missing impellerc under ${FLUTTER_BIN_DIR}/cache/artifacts/engine/{darwin-arm64,darwin-x64}" >&2
                ls -la "${FLUTTER_BIN_DIR}/cache/artifacts/engine" >&2 || true
                exit 1
              fi
              echo "Bundling impellerc from ${IMPELLERC_SRC}"
              MACOS_APP="apps/fterm/build/macos/Build/Products/Release/fterm.app"
              mkdir -p "${MACOS_APP}/Contents/Helpers"
              cp "$IMPELLERC_SRC" "${MACOS_APP}/Contents/Helpers/impellerc"
              chmod +x "${MACOS_APP}/Contents/Helpers/impellerc"
              codesign --force --sign - "${MACOS_APP}/Contents/Helpers/impellerc"
              codesign --force --sign - --entitlements apps/fterm/macos/Runner/Release.entitlements "${MACOS_APP}"
              codesign --verify --deep --strict "${MACOS_APP}"
              codesign -d --entitlements - --xml "${MACOS_APP}" | grep -q 'com.apple.security.network.client'
              COPYFILE_DISABLE=1 tar -C apps/fterm/build/macos/Build/Products/Release -czf "dist/fterm-${TARGET}.tar.gz" fterm.app
              tar -tzf "dist/fterm-${TARGET}.tar.gz" | grep -qx 'fterm.app/Contents/Helpers/impellerc'
            else
              IMPELLERC_SRC="${FLUTTER_BIN_DIR}/cache/artifacts/engine/linux-x64/impellerc"
              test -f "$IMPELLERC_SRC"
              LINUX_BUNDLE="apps/fterm/build/linux/x64/release/bundle"
              mkdir -p "${LINUX_BUNDLE}/helpers"
              cp "$IMPELLERC_SRC" "${LINUX_BUNDLE}/helpers/impellerc"
              chmod +x "${LINUX_BUNDLE}/helpers/impellerc"
              python3 -c '
          import json, os
          root = "apps/fterm/build/linux/x64/release/bundle"
          entries = sorted(set(os.listdir(root)) | {".fterm-files.json"})
          with open(os.path.join(root, ".fterm-files.json"), "w", encoding="utf-8") as f:
              json.dump(entries, f, indent=2)
              f.write("\n")
          '
              tar -C "$LINUX_BUNDLE" -czf "dist/fterm-${TARGET}.tar.gz" .
              tar -tzf "dist/fterm-${TARGET}.tar.gz" | grep -Eq '^(\./)?helpers/impellerc$'
            fi
          fi
          dart build cli -t apps/termui_cast/caster_cli/bin/termui_cast.dart -o build/caster
          ./build/caster/bundle/bin/termui_cast --help > /dev/null
          set +e
          ./build/caster/bundle/bin/termui_cast --server ws://127.0.0.1:9/v1/caster -- /bin/sh -c "exit 3"
          CASTER_EXIT=$?
          set -e
          test "$CASTER_EXIT" -eq 3
          COPYFILE_DISABLE=1 tar -C build/caster/bundle -czf "dist/termui_cast-${TARGET}.tar.gz" bin lib
          tar -tzf "dist/termui_cast-${TARGET}.tar.gz" > build/caster/archive.list
          grep -Fqx 'bin/termui_cast' build/caster/archive.list
          ! grep -Eq '^(bin/termui_cast_server|web/)' build/caster/archive.list

          mkdir -p build/server/bundle/bin
          dart compile exe apps/termui_cast/server/bin/termui_cast_server.dart -o build/server/bundle/bin/termui_cast_server
          ./build/server/bundle/bin/termui_cast_server --help > /dev/null
          set +e
          ./build/server/bundle/bin/termui_cast_server --host 0.0.0.0 2> /dev/null
          SERVER_EXIT=$?
          set -e
          test "$SERVER_EXIT" -eq 64
          tar -xzf dist/fterm-web.tar.gz -C build/server/bundle
          COPYFILE_DISABLE=1 tar -C build/server/bundle -czf "dist/termui_cast_server-${TARGET}.tar.gz" bin web
          tar -tzf "dist/termui_cast_server-${TARGET}.tar.gz" > build/server/archive.list
          grep -Fqx 'bin/termui_cast_server' build/server/archive.list
          grep -Fqx 'web/index.html.gz' build/server/archive.list
          grep -Fqx 'web/main.dart.wasm.gz' build/server/archive.list
          ! grep -Eq '^web/(index\.html|main\.dart\.wasm(\.br)?)$' build/server/archive.list
        env:
          TARGET: ${{ matrix.target }}
          BUILD_DESKTOP: ${{ matrix.build_desktop }}
          DESKTOP_OS: ${{ runner.os == 'macOS' && 'macos' || 'linux' }}
          RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
          BUILD_DATE: ${{ needs.preflight.outputs.build_date }}

      - name: Build and package Windows bundles
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          if ($env:BUILD_DESKTOP -eq "true") {
            Push-Location apps/fterm
            flutter build windows --release --build-name="$env:RELEASE_VERSION" --dart-define="FTERM_BUILD_DATE=$env:BUILD_DATE"
            if ($LASTEXITCODE -ne 0) { throw "flutter build windows failed ($LASTEXITCODE)" }
            Pop-Location
          }
          dart build cli -t apps/termui_cast/caster_cli/bin/termui_cast.dart -o build/caster
          & "./build/caster/bundle/bin/termui_cast.exe" --help | Out-Null
          & "./build/caster/bundle/bin/termui_cast.exe" --download-conpty --server ws://127.0.0.1:9/v1/caster '--' cmd /c "exit 3"
          if ($LASTEXITCODE -ne 3) { throw "Expected exit code 3 from termui_cast.exe, got $LASTEXITCODE" }

          $conptyDir = Get-ChildItem -Path (Join-Path $env:LOCALAPPDATA "pty2\conpty\*\x64") -Directory |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if (-not $conptyDir) {
            throw "Missing staged ConPTY x64 directory under $env:LOCALAPPDATA\pty2\conpty"
          }
          Write-Output "Staging ConPTY from $($conptyDir.FullName)"
          $conptyFiles = @("conpty.dll", "OpenConsole.exe")
          foreach ($file in $conptyFiles) {
            if (-not (Test-Path (Join-Path $conptyDir.FullName $file))) {
              throw "Missing $file in $($conptyDir.FullName)"
            }
          }

          $noticesPath = Join-Path $conptyDir.FullName "THIRD-PARTY-NOTICES.txt"
          @"
          Microsoft.Windows.Console.ConPTY (conpty.dll, OpenConsole.exe)
          MIT License

          Copyright (c) Microsoft Corporation.

          Permission is hereby granted, free of charge, to any person obtaining a copy
          of this software and associated documentation files (the "Software"), to deal
          in the Software without restriction, including without limitation the rights
          to use, copy, modify, merge, publish, distribute, sublicense, and/or sell
          copies of the Software, and to permit persons to whom the Software is
          furnished to do so, subject to the following conditions:

          The above copyright notice and this permission notice shall be included in all
          copies or substantial portions of the Software.

          THE SOFTWARE IS PROVIDED "AS IS", WITHOUT WARRANTY OF ANY KIND, EXPRESS OR
          IMPLIED, INCLUDING BUT NOT LIMITED TO THE WARRANTIES OF MERCHANTABILITY,
          FITNESS FOR A PARTICULAR PURPOSE AND NONINFRINGEMENT. IN NO EVENT SHALL THE
          AUTHORS OR COPYRIGHT HOLDERS BE LIABLE FOR ANY CLAIM, DAMAGES OR OTHER
          LIABILITY, WHETHER IN AN ACTION OF CONTRACT, TORT OR OTHERWISE, ARISING FROM,
          OUT OF OR IN CONNECTION WITH THE SOFTWARE OR THE USE OR OTHER DEALINGS IN THE
          SOFTWARE.
          "@ | Set-Content -Path $noticesPath -Encoding UTF8

          $bundleEntries = $conptyFiles + @("THIRD-PARTY-NOTICES.txt")
          $casterBinDir = "build/caster/bundle/bin"
          foreach ($entry in $bundleEntries) {
            Copy-Item -Path (Join-Path $conptyDir.FullName $entry) -Destination (Join-Path $casterBinDir $entry) -Force
          }
          $casterZip = "dist/termui_cast-$($env:TARGET).zip"
          Compress-Archive -Path "build/caster/bundle/*" -DestinationPath $casterZip -Force

          Add-Type -AssemblyName System.IO.Compression.FileSystem
          function Assert-ZipEntries {
            param(
              [string]$ZipPath,
              [string[]]$RequiredEntries,
              [string[]]$ForbiddenEntries = @(),
              [string[]]$ForbiddenPrefixes = @()
            )
            $zip = [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path $ZipPath))
            try {
              $names = $zip.Entries | ForEach-Object { $_.FullName -replace '\\', '/' }
              foreach ($req in $RequiredEntries) {
                if ($names -notcontains $req) {
                  throw "Archive $ZipPath is missing required entry '$req'"
                }
              }
              foreach ($forbidden in $ForbiddenEntries) {
                if ($names -contains $forbidden) {
                  throw "Archive $ZipPath unexpectedly contains '$forbidden'"
                }
              }
              foreach ($prefix in $ForbiddenPrefixes) {
                $matched = $names | Where-Object { $_.StartsWith($prefix) } | Select-Object -First 1
                if ($matched) {
                  throw "Archive $ZipPath unexpectedly contains '$matched' under '$prefix'"
                }
              }
            } finally {
              $zip.Dispose()
            }
          }
          Assert-ZipEntries -ZipPath $casterZip -RequiredEntries @("bin/termui_cast.exe", "bin/conpty.dll", "bin/OpenConsole.exe", "bin/THIRD-PARTY-NOTICES.txt") -ForbiddenEntries @("bin/termui_cast_server.exe") -ForbiddenPrefixes @("web/")
          Write-Output "Packaged $casterZip"

          New-Item -ItemType Directory -Force -Path build/server/bundle/bin | Out-Null
          dart compile exe apps/termui_cast/server/bin/termui_cast_server.dart -o build/server/bundle/bin/termui_cast_server.exe
          Write-Output "Verifying termui_cast_server.exe..."
          & "./build/server/bundle/bin/termui_cast_server.exe" --help | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "Expected exit code 0 from termui_cast_server.exe --help, got $LASTEXITCODE" }
          $serverProc = Start-Process -FilePath "./build/server/bundle/bin/termui_cast_server.exe" -ArgumentList "--host", "0.0.0.0" -NoNewWindow -Wait -PassThru -RedirectStandardError "dist/server-check.err"
          $serverErr = if (Test-Path "dist/server-check.err") { Get-Content "dist/server-check.err" -Raw } else { "" }
          Remove-Item -Path "dist/server-check.err" -ErrorAction SilentlyContinue
          if ($serverProc.ExitCode -ne 64) { throw "Expected exit code 64 from termui_cast_server.exe, got $($serverProc.ExitCode): $serverErr" }
          $global:LASTEXITCODE = 0
          tar.exe -xzf dist/fterm-web.tar.gz -C build/server/bundle
          if ($LASTEXITCODE -ne 0) { throw "Failed to extract fterm-web.tar.gz ($LASTEXITCODE)" }
          $serverZip = "dist/termui_cast_server-$($env:TARGET).zip"
          Compress-Archive -Path "build/server/bundle/*" -DestinationPath $serverZip -Force
          Assert-ZipEntries -ZipPath $serverZip -RequiredEntries @("bin/termui_cast_server.exe", "web/index.html.gz", "web/main.dart.wasm.gz") -ForbiddenEntries @("bin/termui_cast.exe", "bin/conpty.dll", "web/index.html", "web/main.dart.wasm", "web/main.dart.wasm.br")
          Write-Output "Packaged $serverZip"

          if ($env:BUILD_DESKTOP -eq "true") {
            $ftermReleaseDir = "apps/fterm/build/windows/x64/runner/Release"
            foreach ($entry in $bundleEntries) {
              Copy-Item -Path (Join-Path $conptyDir.FullName $entry) -Destination (Join-Path $ftermReleaseDir $entry) -Force
            }
            $flutterBinDir = Split-Path -Parent (Get-Command flutter).Source
            $impellercSrc = Join-Path $flutterBinDir "cache\artifacts\engine\windows-x64\impellerc.exe"
            if (-not (Test-Path $impellercSrc)) {
              throw "Missing impellerc.exe at $impellercSrc"
            }
            $helpersDir = Join-Path $ftermReleaseDir "helpers"
            New-Item -ItemType Directory -Force -Path $helpersDir | Out-Null
            Copy-Item -Path $impellercSrc -Destination (Join-Path $helpersDir "impellerc.exe") -Force
            $ownedEntries = @(
              @(Get-ChildItem -Path $ftermReleaseDir -Force | Select-Object -ExpandProperty Name) + @(".fterm-files.json") |
                ForEach-Object { $_ -replace '\\', '/' } |
                Sort-Object -Unique
            )
            ConvertTo-Json -InputObject $ownedEntries |
              Set-Content -Path (Join-Path $ftermReleaseDir ".fterm-files.json") -Encoding utf8NoBOM
            $ftermZip = "dist/fterm-$($env:TARGET).zip"
            Compress-Archive -Path (Get-ChildItem -Path $ftermReleaseDir -Force).FullName -DestinationPath $ftermZip -Force
            Assert-ZipEntries -ZipPath $ftermZip -RequiredEntries ($bundleEntries + @("fterm.exe", ".fterm-files.json", "helpers/impellerc.exe"))
            Write-Output "Packaged $ftermZip"
          }
        env:
          TARGET: ${{ matrix.target }}
          BUILD_DESKTOP: ${{ matrix.build_desktop }}
          RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
          BUILD_DATE: ${{ needs.preflight.outputs.build_date }}

      - name: Upload fterm desktop bundle artifact
        if: matrix.build_desktop
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fterm-${{ matrix.target }}
          path: dist/fterm-${{ matrix.target }}.${{ matrix.archive_ext }}
          if-no-files-found: error

      - name: Upload termui_cast bundle artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: termui_cast-${{ matrix.target }}
          path: dist/termui_cast-${{ matrix.target }}.${{ matrix.archive_ext }}
          if-no-files-found: error

      - name: Upload termui_cast_server bundle artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: termui_cast_server-${{ matrix.target }}
          path: dist/termui_cast_server-${{ matrix.target }}.${{ matrix.archive_ext }}
          if-no-files-found: error

  release:
    name: Tag and Publish fterm Release
    needs: [preflight, build-web, build]
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Download release artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true

      - name: Tag and create GitHub Release
        run: |
          if [[ ! "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Invalid version '$RELEASE_VERSION'."
            exit 1
          fi
          TAG="fterm-v${RELEASE_VERSION}"
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}" >/dev/null 2>&1; then
            echo "::error::Tag $TAG already exists."
            exit 1
          fi

          extract_changelog() {
            local file="$1"
            local ver="$2"
            if [ -f "$file" ]; then
              awk -v ver="$ver" '
                $0 == "## " ver { found = 1; next }
                found && /^## / { exit }
                found { print }
              ' "$file"
            fi
          }

          HAS_CHANGELOG="false"
          : > changelog-section.md

          FTERM_NOTES="$(extract_changelog apps/fterm/CHANGELOG.md "$RELEASE_VERSION")"
          if [ -n "$FTERM_NOTES" ]; then
            HAS_CHANGELOG="true"
            printf '### `fterm` (`v%s`)\n%s\n\n' "$RELEASE_VERSION" "$FTERM_NOTES" >> changelog-section.md
          fi

          for pkg_dir in \
            apps/termui_cast/protocol \
            apps/termui_cast/server \
            apps/termui_cast/caster_cli \
            apps/termui_cast/client_core; do
            pkg_name="$(sed -n 's/^name:[[:space:]]*\([^[:space:]#]*\).*/\1/p' "${pkg_dir}/pubspec.yaml" | head -n 1)"
            pkg_ver="$(sed -n 's/^version:[[:space:]]*\([^[:space:]#+]*\).*/\1/p' "${pkg_dir}/pubspec.yaml" | head -n 1)"
            pkg_tag="${pkg_name}-v${pkg_ver}"
            if ! gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${pkg_tag}" >/dev/null 2>&1; then
              pkg_notes="$(extract_changelog "${pkg_dir}/CHANGELOG.md" "$pkg_ver")"
              if [ -n "$pkg_notes" ]; then
                HAS_CHANGELOG="true"
                printf '### `%s` (`v%s`)\n%s\n\n' "$pkg_name" "$pkg_ver" "$pkg_notes" >> changelog-section.md
              fi
            fi
          done

          cat <<'EOF' > install-notes.md
          ### Installing Prebuilt Archives (Unsigned Builds)

          Release binaries are built on GitHub Actions without paid Apple Developer ID or Windows Authenticode certificates:

          - **macOS (`fterm-macos-arm64.tar.gz`)**: Extract the archive and clear the browser quarantine attribute before first launch so Gatekeeper does not report `fterm.app` as damaged:
            ```bash
            tar -xzf fterm-macos-arm64.tar.gz
            xattr -dr com.apple.quarantine fterm.app
            open fterm.app
            ```
          - **Windows (`fterm-windows-x64.zip`)**: Extract the entire `.zip` folder (keeping `conpty.dll`, `OpenConsole.exe`, and `data/` next to `fterm.exe`), launch `fterm.exe`, and select **More info** -> **Run anyway** if Windows SmartScreen prompts on first launch.
          - **Linux (`fterm-linux-x64.tar.gz`)**:
            ```bash
            mkdir -p fterm && tar -xzf fterm-linux-x64.tar.gz -C fterm && ./fterm/fterm
            ```
          - **Self-Hosted Relay Server (`termui_cast_server-<os>-<arch>.tar.gz` / `.zip`, plus standalone `fterm-web.tar.gz`)**: `termui_cast_server` is now packaged separately from `termui_cast-<os>-<arch>` together with the prebuilt WASM web viewer under `web/` (compressible assets stored as `.gz` without uncompressed duplicates). Extract the archive and run `./bin/termui_cast_server` — it auto-discovers the adjacent `web/` directory with no local Dart/Flutter SDK required. `fterm-web.tar.gz` contains the same gzip-only `web/` directory for `termui_cast_server --web-dir` or proxies configured for gzip-only static files.
          - **Caster CLI (`termui_cast-<os>-<arch>.tar.gz` / `.zip`)**: Lightweight PTY caster bundle containing `bin/termui_cast` and native PTY libraries (`lib/` on Unix, ConPTY binaries on Windows) without `termui_cast_server` or `web/`.
          EOF

          # Always create as draft first so GitHub Immutable Releases locks the tag
          # and asset digests only after every archive is uploaded.
          FLAGS=(--draft)
          if [ "$IS_PRERELEASE" = "true" ]; then
            FLAGS+=(--prerelease)
          fi

          if [ "$HAS_CHANGELOG" = "true" ]; then
            {
              printf '## Changes\n\n'
              cat changelog-section.md
              cat install-notes.md
            } > release-notes.md
            gh release create "$TAG" dist/* \
              --target "$TARGET_SHA" \
              --title "$TAG" \
              --notes-file release-notes.md \
              "${FLAGS[@]}"
          else
            gh release create "$TAG" dist/* \
              --target "$TARGET_SHA" \
              --title "$TAG" \
              --generate-notes \
              --notes "$(cat install-notes.md)" \
              "${FLAGS[@]}"
          fi
          rm -f changelog-section.md install-notes.md release-notes.md

          if [ "$IS_DRAFT" != "true" ]; then
            gh release edit "$TAG" --draft=false
          fi

          # Record companion Melos baseline tags for termui_cast packages when publishing a non-draft release.
          if [ "$IS_DRAFT" != "true" ]; then
            for pkg_dir in \
              apps/termui_cast/protocol \
              apps/termui_cast/server \
              apps/termui_cast/caster_cli \
              apps/termui_cast/client_core; do
              pkg_name="$(sed -n 's/^name:[[:space:]]*\([^[:space:]#]*\).*/\1/p' "${pkg_dir}/pubspec.yaml" | head -n 1)"
              pkg_ver="$(sed -n 's/^version:[[:space:]]*\([^[:space:]#+]*\).*/\1/p' "${pkg_dir}/pubspec.yaml" | head -n 1)"
              pkg_tag="${pkg_name}-v${pkg_ver}"
              if ! gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${pkg_tag}" >/dev/null 2>&1; then
                gh api "repos/${GITHUB_REPOSITORY}/git/refs" \
                  -f ref="refs/tags/${pkg_tag}" \
                  -f sha="$TARGET_SHA" >/dev/null
              fi
            done
          fi
        env:
          RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
          IS_DRAFT: ${{ needs.preflight.outputs.is_draft }}
          IS_PRERELEASE: ${{ needs.preflight.outputs.is_prerelease }}
          TARGET_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
