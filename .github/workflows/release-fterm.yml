name: Release fterm

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version without fterm-v prefix (e.g. 0.1.0)'
        required: true
        type: string
      draft:
        description: 'Create GitHub release as a draft'
        required: false
        default: false
        type: boolean
      prerelease:
        description: 'Mark GitHub release as a prerelease'
        required: false
        default: false
        type: boolean

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: macos-arm64
            os: macos-14
            archive_ext: tar.gz
            build_desktop: true
          - target: linux-x64
            os: ubuntu-22.04
            archive_ext: tar.gz
            build_desktop: true
          - target: windows-x64
            os: windows-latest
            archive_ext: zip
            build_desktop: true
          - target: linux-arm64
            os: ubuntu-24.04-arm
            archive_ext: tar.gz
            build_desktop: false

    steps:
      - name: Validate version input
        shell: bash
        run: |
          if [[ ! "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Invalid version '$RELEASE_VERSION'. Expected semantic version like 0.1.0 or 0.1.0-rc.1."
            exit 1
          fi
        env:
          RELEASE_VERSION: ${{ inputs.version }}

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          if [ "$BUILD_DESKTOP" = "true" ]; then
            sudo apt-get install -y --no-install-recommends clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libasound2-dev
          else
            sudo apt-get install -y --no-install-recommends libasound2-dev
          fi
        env:
          BUILD_DESKTOP: ${{ matrix.build_desktop }}

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          cache: true

      - name: Install workspace dependencies
        run: flutter pub get

      - name: Build and package Unix bundles
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist
          if [ "$BUILD_DESKTOP" = "true" ]; then
            (cd apps/fterm && flutter build "$DESKTOP_OS" --release)
            if [ "$DESKTOP_OS" = "macos" ]; then
              tar -C apps/fterm/build/macos/Build/Products/Release -czf "dist/fterm-${TARGET}.tar.gz" fterm.app
            else
              tar -C apps/fterm/build/linux/x64/release/bundle -czf "dist/fterm-${TARGET}.tar.gz" .
            fi
          fi
          dart build cli -t apps/termui_cast/caster_cli/bin/termui_cast.dart -o build/caster
          ./build/caster/bundle/bin/termui_cast --help > /dev/null
          set +e
          ./build/caster/bundle/bin/termui_cast --server ws://127.0.0.1:9/v1/caster -- /bin/sh -c "exit 3"
          CASTER_EXIT=$?
          set -e
          test "$CASTER_EXIT" -eq 3
          dart compile exe apps/termui_cast/server/bin/termui_cast_server.dart -o build/caster/bundle/bin/termui_cast_server
          ./build/caster/bundle/bin/termui_cast_server --help > /dev/null
          set +e
          ./build/caster/bundle/bin/termui_cast_server --host 0.0.0.0 2> /dev/null
          SERVER_EXIT=$?
          set -e
          test "$SERVER_EXIT" -eq 64
          tar -C build/caster/bundle -czf "dist/termui_cast-${TARGET}.tar.gz" bin lib
        env:
          TARGET: ${{ matrix.target }}
          BUILD_DESKTOP: ${{ matrix.build_desktop }}
          DESKTOP_OS: ${{ runner.os == 'macOS' && 'macos' || 'linux' }}

      - name: Build and package Windows bundles
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          if ($env:BUILD_DESKTOP -eq "true") {
            Push-Location apps/fterm
            flutter build windows --release
            if ($LASTEXITCODE -ne 0) { throw "flutter build windows failed ($LASTEXITCODE)" }
            Pop-Location
            Compress-Archive -Path "apps/fterm/build/windows/x64/runner/Release/*" -DestinationPath "dist/fterm-$($env:TARGET).zip" -Force
          }
          dart build cli -t apps/termui_cast/caster_cli/bin/termui_cast.dart -o build/caster
          & "./build/caster/bundle/bin/termui_cast.exe" --help | Out-Null
          & "./build/caster/bundle/bin/termui_cast.exe" --download-conpty --server ws://127.0.0.1:9/v1/caster '--' cmd /c "exit 3"
          if ($LASTEXITCODE -ne 3) { throw "Expected exit code 3 from termui_cast.exe, got $LASTEXITCODE" }
          dart compile exe apps/termui_cast/server/bin/termui_cast_server.dart -o build/caster/bundle/bin/termui_cast_server.exe
          & "./build/caster/bundle/bin/termui_cast_server.exe" --help | Out-Null
          & "./build/caster/bundle/bin/termui_cast_server.exe" --host 0.0.0.0 2>$null
          if ($LASTEXITCODE -ne 64) { throw "Expected exit code 64 from termui_cast_server.exe, got $LASTEXITCODE" }
          Compress-Archive -Path "build/caster/bundle/*" -DestinationPath "dist/termui_cast-$($env:TARGET).zip" -Force
        env:
          TARGET: ${{ matrix.target }}
          BUILD_DESKTOP: ${{ matrix.build_desktop }}

      - name: Upload fterm desktop bundle artifact
        if: matrix.build_desktop
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fterm-${{ matrix.target }}
          path: dist/fterm-${{ matrix.target }}.${{ matrix.archive_ext }}
          if-no-files-found: error

      - name: Upload termui_cast bundle artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: termui_cast-${{ matrix.target }}
          path: dist/termui_cast-${{ matrix.target }}.${{ matrix.archive_ext }}
          if-no-files-found: error

  release:
    name: Tag and Publish fterm Release
    needs: build
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Download release artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true

      - name: Configure Git
        run: |
          gh auth setup-git
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag and create GitHub Release
        run: |
          if [[ ! "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Invalid version '$RELEASE_VERSION'."
            exit 1
          fi
          TAG="fterm-v${RELEASE_VERSION}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "::error::Tag $TAG already exists."
            exit 1
          fi
          git tag -a "$TAG" -m "Release $TAG" "$TARGET_SHA"
          git push origin "$TAG"
          FLAGS=()
          if [ "$IS_DRAFT" = "true" ]; then
            FLAGS+=(--draft)
          fi
          if [ "$IS_PRERELEASE" = "true" ]; then
            FLAGS+=(--prerelease)
          fi
          gh release create "$TAG" dist/* --title "$TAG" --generate-notes "${FLAGS[@]}"
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          IS_DRAFT: ${{ inputs.draft }}
          IS_PRERELEASE: ${{ inputs.prerelease }}
          TARGET_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
