name: Release fterm

on:
  push:
    branches:
      - main
    paths:
      - 'apps/fterm/pubspec.yaml'
  workflow_dispatch:
    inputs:
      version:
        description: 'Optional version override without fterm-v prefix (defaults to apps/fterm/pubspec.yaml)'
        required: false
        default: ''
        type: string
      draft:
        description: 'Create GitHub release as a draft'
        required: false
        default: false
        type: boolean
      prerelease:
        description: 'Mark GitHub release as a prerelease (auto-enabled for pre-release versions)'
        required: false
        default: false
        type: boolean

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    name: Preflight release checks
    if: >-
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.head_commit.message, 'chore(fterm-release):')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      version: ${{ steps.meta.outputs.version }}
      is_draft: ${{ steps.meta.outputs.is_draft }}
      is_prerelease: ${{ steps.meta.outputs.is_prerelease }}
    steps:
      - name: Checkout fterm pubspec
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            apps/fterm/pubspec.yaml

      - name: Resolve version and validate tag availability
        id: meta
        run: |
          RELEASE_VERSION="${INPUT_VERSION}"
          if [ -z "$RELEASE_VERSION" ]; then
            RELEASE_VERSION="$(sed -n 's/^version:[[:space:]]*\([^[:space:]#+]*\).*/\1/p' apps/fterm/pubspec.yaml | head -n 1)"
          fi
          if [[ ! "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Invalid version '$RELEASE_VERSION'. Expected semantic version like 0.1.0 or 0.1.0-rc.1."
            exit 1
          fi
          TAG="fterm-v${RELEASE_VERSION}"
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}" >/dev/null 2>&1; then
            echo "::error::Tag $TAG already exists."
            exit 1
          fi
          IS_DRAFT="false"
          if [ "$INPUT_DRAFT" = "true" ]; then
            IS_DRAFT="true"
          fi
          IS_PRERELEASE="false"
          if [ "$INPUT_PRERELEASE" = "true" ] || [[ "$RELEASE_VERSION" == *-* ]]; then
            IS_PRERELEASE="true"
          fi
          {
            printf 'version=%s\n' "$RELEASE_VERSION"
            printf 'is_draft=%s\n' "$IS_DRAFT"
            printf 'is_prerelease=%s\n' "$IS_PRERELEASE"
          } >> "$GITHUB_OUTPUT"
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_DRAFT: ${{ inputs.draft }}
          INPUT_PRERELEASE: ${{ inputs.prerelease }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    name: Build (${{ matrix.target }})
    needs: preflight
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: macos-arm64
            os: macos-latest
            archive_ext: tar.gz
            build_desktop: true
          - target: linux-x64
            os: ubuntu-22.04
            archive_ext: tar.gz
            build_desktop: true
          - target: windows-x64
            os: windows-latest
            archive_ext: zip
            build_desktop: true
          # Disabled for now: Flutter does not publish linux-arm64 release archives
          # required by subosito/flutter-action (requires cloning the SDK + fetching tools).
          # - target: linux-arm64
          #   os: ubuntu-24.04-arm
          #   archive_ext: tar.gz
          #   build_desktop: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          if [ "$BUILD_DESKTOP" = "true" ]; then
            sudo apt-get install -y --no-install-recommends clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libasound2-dev
          else
            sudo apt-get install -y --no-install-recommends libasound2-dev
          fi
        env:
          BUILD_DESKTOP: ${{ matrix.build_desktop }}

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          cache: true

      - name: Install workspace dependencies
        run: flutter pub get

      - name: Build and package Unix bundles
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist
          if [ "$BUILD_DESKTOP" = "true" ]; then
            (cd apps/fterm && flutter build "$DESKTOP_OS" --release --build-name="$RELEASE_VERSION")
            if [ "$DESKTOP_OS" = "macos" ]; then
              tar -C apps/fterm/build/macos/Build/Products/Release -czf "dist/fterm-${TARGET}.tar.gz" fterm.app
            else
              tar -C apps/fterm/build/linux/x64/release/bundle -czf "dist/fterm-${TARGET}.tar.gz" .
            fi
          fi
          dart build cli -t apps/termui_cast/caster_cli/bin/termui_cast.dart -o build/caster
          ./build/caster/bundle/bin/termui_cast --help > /dev/null
          set +e
          ./build/caster/bundle/bin/termui_cast --server ws://127.0.0.1:9/v1/caster -- /bin/sh -c "exit 3"
          CASTER_EXIT=$?
          set -e
          test "$CASTER_EXIT" -eq 3
          dart compile exe apps/termui_cast/server/bin/termui_cast_server.dart -o build/caster/bundle/bin/termui_cast_server
          ./build/caster/bundle/bin/termui_cast_server --help > /dev/null
          set +e
          ./build/caster/bundle/bin/termui_cast_server --host 0.0.0.0 2> /dev/null
          SERVER_EXIT=$?
          set -e
          test "$SERVER_EXIT" -eq 64
          tar -C build/caster/bundle -czf "dist/termui_cast-${TARGET}.tar.gz" bin lib
        env:
          TARGET: ${{ matrix.target }}
          BUILD_DESKTOP: ${{ matrix.build_desktop }}
          DESKTOP_OS: ${{ runner.os == 'macOS' && 'macos' || 'linux' }}
          RELEASE_VERSION: ${{ needs.preflight.outputs.version }}

      - name: Build and package Windows bundles
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          if ($env:BUILD_DESKTOP -eq "true") {
            Push-Location apps/fterm
            flutter build windows --release --build-name="$env:RELEASE_VERSION"
            if ($LASTEXITCODE -ne 0) { throw "flutter build windows failed ($LASTEXITCODE)" }
            Pop-Location
          }
          dart build cli -t apps/termui_cast/caster_cli/bin/termui_cast.dart -o build/caster
          & "./build/caster/bundle/bin/termui_cast.exe" --help | Out-Null
          & "./build/caster/bundle/bin/termui_cast.exe" --download-conpty --server ws://127.0.0.1:9/v1/caster '--' cmd /c "exit 3"
          if ($LASTEXITCODE -ne 3) { throw "Expected exit code 3 from termui_cast.exe, got $LASTEXITCODE" }
          dart compile exe apps/termui_cast/server/bin/termui_cast_server.dart -o build/caster/bundle/bin/termui_cast_server.exe
          Write-Output "Verifying termui_cast_server.exe..."
          & "./build/caster/bundle/bin/termui_cast_server.exe" --help | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "Expected exit code 0 from termui_cast_server.exe --help, got $LASTEXITCODE" }
          $serverProc = Start-Process -FilePath "./build/caster/bundle/bin/termui_cast_server.exe" -ArgumentList "--host", "0.0.0.0" -NoNewWindow -Wait -PassThru -RedirectStandardError "dist/server-check.err"
          $serverErr = if (Test-Path "dist/server-check.err") { Get-Content "dist/server-check.err" -Raw } else { "" }
          Remove-Item -Path "dist/server-check.err" -ErrorAction SilentlyContinue
          if ($serverProc.ExitCode -ne 64) { throw "Expected exit code 64 from termui_cast_server.exe, got $($serverProc.ExitCode): $serverErr" }
          $global:LASTEXITCODE = 0

          $conptyDir = Get-ChildItem -Path (Join-Path $env:LOCALAPPDATA "pty2\conpty\*\x64") -Directory |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if (-not $conptyDir) {
            throw "Missing staged ConPTY x64 directory under $env:LOCALAPPDATA\pty2\conpty"
          }
          Write-Output "Staging ConPTY from $($conptyDir.FullName)"
          $conptyFiles = @("conpty.dll", "OpenConsole.exe")
          foreach ($file in $conptyFiles) {
            if (-not (Test-Path (Join-Path $conptyDir.FullName $file))) {
              throw "Missing $file in $($conptyDir.FullName)"
            }
          }

          $noticesPath = Join-Path $conptyDir.FullName "THIRD-PARTY-NOTICES.txt"
          @"
          Microsoft.Windows.Console.ConPTY (conpty.dll, OpenConsole.exe)
          MIT License

          Copyright (c) Microsoft Corporation.

          Permission is hereby granted, free of charge, to any person obtaining a copy
          of this software and associated documentation files (the "Software"), to deal
          in the Software without restriction, including without limitation the rights
          to use, copy, modify, merge, publish, distribute, sublicense, and/or sell
          copies of the Software, and to permit persons to whom the Software is
          furnished to do so, subject to the following conditions:

          The above copyright notice and this permission notice shall be included in all
          copies or substantial portions of the Software.

          THE SOFTWARE IS PROVIDED "AS IS", WITHOUT WARRANTY OF ANY KIND, EXPRESS OR
          IMPLIED, INCLUDING BUT NOT LIMITED TO THE WARRANTIES OF MERCHANTABILITY,
          FITNESS FOR A PARTICULAR PURPOSE AND NONINFRINGEMENT. IN NO EVENT SHALL THE
          AUTHORS OR COPYRIGHT HOLDERS BE LIABLE FOR ANY CLAIM, DAMAGES OR OTHER
          LIABILITY, WHETHER IN AN ACTION OF CONTRACT, TORT OR OTHERWISE, ARISING FROM,
          OUT OF OR IN CONNECTION WITH THE SOFTWARE OR THE USE OR OTHER DEALINGS IN THE
          SOFTWARE.
          "@ | Set-Content -Path $noticesPath -Encoding UTF8

          $bundleEntries = $conptyFiles + @("THIRD-PARTY-NOTICES.txt")
          $casterBinDir = "build/caster/bundle/bin"
          foreach ($entry in $bundleEntries) {
            Copy-Item -Path (Join-Path $conptyDir.FullName $entry) -Destination (Join-Path $casterBinDir $entry) -Force
          }
          $casterZip = "dist/termui_cast-$($env:TARGET).zip"
          Compress-Archive -Path "build/caster/bundle/*" -DestinationPath $casterZip -Force

          Add-Type -AssemblyName System.IO.Compression.FileSystem
          function Assert-ZipEntries {
            param([string]$ZipPath, [string[]]$RequiredEntries)
            $zip = [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path $ZipPath))
            try {
              $names = $zip.Entries | ForEach-Object { $_.FullName -replace '\\', '/' }
              foreach ($req in $RequiredEntries) {
                if ($names -notcontains $req) {
                  throw "Archive $ZipPath is missing required entry '$req'"
                }
              }
            } finally {
              $zip.Dispose()
            }
          }
          Assert-ZipEntries -ZipPath $casterZip -RequiredEntries @("bin/conpty.dll", "bin/OpenConsole.exe", "bin/THIRD-PARTY-NOTICES.txt")
          Write-Output "Packaged $casterZip"

          if ($env:BUILD_DESKTOP -eq "true") {
            $ftermReleaseDir = "apps/fterm/build/windows/x64/runner/Release"
            foreach ($entry in $bundleEntries) {
              Copy-Item -Path (Join-Path $conptyDir.FullName $entry) -Destination (Join-Path $ftermReleaseDir $entry) -Force
            }
            $ftermZip = "dist/fterm-$($env:TARGET).zip"
            Compress-Archive -Path "$ftermReleaseDir/*" -DestinationPath $ftermZip -Force
            Assert-ZipEntries -ZipPath $ftermZip -RequiredEntries $bundleEntries
            Write-Output "Packaged $ftermZip"
          }
        env:
          TARGET: ${{ matrix.target }}
          BUILD_DESKTOP: ${{ matrix.build_desktop }}
          RELEASE_VERSION: ${{ needs.preflight.outputs.version }}

      - name: Upload fterm desktop bundle artifact
        if: matrix.build_desktop
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fterm-${{ matrix.target }}
          path: dist/fterm-${{ matrix.target }}.${{ matrix.archive_ext }}
          if-no-files-found: error

      - name: Upload termui_cast bundle artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: termui_cast-${{ matrix.target }}
          path: dist/termui_cast-${{ matrix.target }}.${{ matrix.archive_ext }}
          if-no-files-found: error

  release:
    name: Tag and Publish fterm Release
    needs: [preflight, build]
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Download release artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true

      - name: Tag and create GitHub Release
        run: |
          if [[ ! "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Invalid version '$RELEASE_VERSION'."
            exit 1
          fi
          TAG="fterm-v${RELEASE_VERSION}"
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}" >/dev/null 2>&1; then
            echo "::error::Tag $TAG already exists."
            exit 1
          fi

          extract_changelog() {
            local file="$1"
            local ver="$2"
            if [ -f "$file" ]; then
              awk -v ver="$ver" '
                $0 == "## " ver { found = 1; next }
                found && /^## / { exit }
                found { print }
              ' "$file"
            fi
          }

          HAS_CHANGELOG="false"
          : > changelog-section.md

          FTERM_NOTES="$(extract_changelog apps/fterm/CHANGELOG.md "$RELEASE_VERSION")"
          if [ -n "$FTERM_NOTES" ]; then
            HAS_CHANGELOG="true"
            printf '### `fterm` (`v%s`)\n%s\n\n' "$RELEASE_VERSION" "$FTERM_NOTES" >> changelog-section.md
          fi

          for pkg_dir in \
            apps/termui_cast/protocol \
            apps/termui_cast/server \
            apps/termui_cast/caster_cli \
            apps/termui_cast/client_core; do
            pkg_name="$(sed -n 's/^name:[[:space:]]*\([^[:space:]#]*\).*/\1/p' "${pkg_dir}/pubspec.yaml" | head -n 1)"
            pkg_ver="$(sed -n 's/^version:[[:space:]]*\([^[:space:]#+]*\).*/\1/p' "${pkg_dir}/pubspec.yaml" | head -n 1)"
            pkg_tag="${pkg_name}-v${pkg_ver}"
            if ! gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${pkg_tag}" >/dev/null 2>&1; then
              pkg_notes="$(extract_changelog "${pkg_dir}/CHANGELOG.md" "$pkg_ver")"
              if [ -n "$pkg_notes" ]; then
                HAS_CHANGELOG="true"
                printf '### `%s` (`v%s`)\n%s\n\n' "$pkg_name" "$pkg_ver" "$pkg_notes" >> changelog-section.md
              fi
            fi
          done

          cat <<'EOF' > install-notes.md
          ### Installing Prebuilt Archives (Unsigned Builds)

          Release binaries are built on GitHub Actions without paid Apple Developer ID or Windows Authenticode certificates:

          - **macOS (`fterm-macos-arm64.tar.gz`)**: Extract the archive and clear the browser quarantine attribute before first launch so Gatekeeper does not report `fterm.app` as damaged:
            ```bash
            tar -xzf fterm-macos-arm64.tar.gz
            xattr -dr com.apple.quarantine fterm.app
            open fterm.app
            ```
          - **Windows (`fterm-windows-x64.zip`)**: Extract the entire `.zip` folder (keeping `conpty.dll`, `OpenConsole.exe`, and `data/` next to `fterm.exe`), launch `fterm.exe`, and select **More info** -> **Run anyway** if Windows SmartScreen prompts on first launch.
          - **Linux (`fterm-linux-x64.tar.gz`)**:
            ```bash
            mkdir -p fterm && tar -xzf fterm-linux-x64.tar.gz -C fterm && ./fterm/fterm
            ```
          EOF

          FLAGS=()
          if [ "$IS_DRAFT" = "true" ]; then
            FLAGS+=(--draft)
          fi
          if [ "$IS_PRERELEASE" = "true" ]; then
            FLAGS+=(--prerelease)
          fi

          if [ "$HAS_CHANGELOG" = "true" ]; then
            {
              printf '## Changes\n\n'
              cat changelog-section.md
              cat install-notes.md
            } > release-notes.md
            gh release create "$TAG" dist/* \
              --target "$TARGET_SHA" \
              --title "$TAG" \
              --notes-file release-notes.md \
              "${FLAGS[@]}"
          else
            gh release create "$TAG" dist/* \
              --target "$TARGET_SHA" \
              --title "$TAG" \
              --generate-notes \
              --notes "$(cat install-notes.md)" \
              "${FLAGS[@]}"
          fi
          rm -f changelog-section.md install-notes.md release-notes.md

          # Record companion Melos baseline tags for termui_cast packages when publishing a non-draft release.
          if [ "$IS_DRAFT" != "true" ]; then
            for pkg_dir in \
              apps/termui_cast/protocol \
              apps/termui_cast/server \
              apps/termui_cast/caster_cli \
              apps/termui_cast/client_core; do
              pkg_name="$(sed -n 's/^name:[[:space:]]*\([^[:space:]#]*\).*/\1/p' "${pkg_dir}/pubspec.yaml" | head -n 1)"
              pkg_ver="$(sed -n 's/^version:[[:space:]]*\([^[:space:]#+]*\).*/\1/p' "${pkg_dir}/pubspec.yaml" | head -n 1)"
              pkg_tag="${pkg_name}-v${pkg_ver}"
              if ! gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${pkg_tag}" >/dev/null 2>&1; then
                gh api "repos/${GITHUB_REPOSITORY}/git/refs" \
                  -f ref="refs/tags/${pkg_tag}" \
                  -f sha="$TARGET_SHA" >/dev/null
              fi
            done
          fi
        env:
          RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
          IS_DRAFT: ${{ needs.preflight.outputs.is_draft }}
          IS_PRERELEASE: ${{ needs.preflight.outputs.is_prerelease }}
          TARGET_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
