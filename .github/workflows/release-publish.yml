name: Publish packages
on:  
  push:  
    tags:  
      - '*-v*'  
      - '!fterm-v*'
  workflow_dispatch:
jobs:
  publish-packages:
    name: Publish packages
    if: ${{ !startsWith(github.ref, 'refs/tags/fterm-v') }}
    permissions:
      contents: write
      id-token: write # Required for authentication using OIDC
    runs-on: [ ubuntu-latest ]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dart-lang/setup-dart@2286a0c042b44434fe26d292bbce8d34f7ec662b # v1.8.2
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
      - uses: bluefireteam/melos-action@b79b63bcd183f823740a7976cbdb4b0fc95a0eb8 # v3.10.0
        with:
          publish: true
          create-release: true
          dart-version: none # Explicitly bypasses the crashing internal setup
