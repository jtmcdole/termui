name: Prepare fterm release

on:
  workflow_dispatch:
    inputs:
      prerelease:
        description: 'Version as prerelease'
        required: false
        default: false
        type: boolean
      graduate:
        description: 'Graduate prereleases to stable'
        required: false
        default: false
        type: boolean
      manual_version:
        description: 'Optional manual bump for fterm (patch, minor, major, or X.Y.Z)'
        required: false
        default: ''
        type: string

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare-fterm-release:
    name: Prepare fterm release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          cache: true

      - name: Install workspace dependencies
        run: flutter pub get

      - name: Bump versions and generate changelogs with Melos
        run: |
          if [ "$IS_PRERELEASE" = "true" ] && [ "$IS_GRADUATE" = "true" ]; then
            echo "::error::Cannot enable both 'prerelease' and 'graduate'."
            exit 1
          fi
          if [ -n "$MANUAL_VERSION" ]; then
            if [ "$IS_PRERELEASE" = "true" ] || [ "$IS_GRADUATE" = "true" ]; then
              echo "::error::Cannot combine 'manual_version' with 'prerelease' or 'graduate'."
              exit 1
            fi
            if [[ ! "$MANUAL_VERSION" =~ ^(patch|minor|major|[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?)$ ]]; then
              echo "::error::Invalid manual_version '$MANUAL_VERSION'. Expected patch, minor, major, or SemVer like 0.2.0."
              exit 1
            fi
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          RELEASE_BRANCH="release/fterm"
          git checkout -B "$RELEASE_BRANCH" --track origin/main

          restore_workspace_manifest() {
            git checkout -- pubspec.yaml
          }
          trap restore_workspace_manifest EXIT

          MELOS_BIN="$(python3 -c 'import json, os, urllib.parse; cfg = json.load(open(".dart_tool/package_config.json")); uri = next(p["rootUri"] for p in cfg["packages"] if p["name"] == "melos"); p = urllib.parse.unquote(urllib.parse.urlparse(uri).path); p = p[1:] if len(p) > 2 and p[0] == "/" and p[2] == ":" else p; print(os.path.join(p, "bin", "melos.dart"))')"

          # Temporarily exclude packages/* from the workspace list so Melos
          # does not block bumping unpublished apps/* when packages/* have
          # commits not yet published to pub.dev.
          python3 -c 'import re; p = open("pubspec.yaml").read(); updated = re.sub(r"(?m)^[ \t]*-[ \t]*packages/[^\r\n]+\r?\n", "", p); assert p != updated, "Failed to strip packages/* entries from pubspec.yaml"; open("pubspec.yaml", "w").write(updated)'
          # Keep pubspec.lock newer than the temporary pubspec.yaml so
          # cli_launcher does not re-run `flutter pub get` without packages/*.
          touch pubspec.lock

          MELOS_ARGS=(
            version
            --yes
            --all
            --no-git-tag-version
            --no-git-commit-version
            --scope=fterm
            --scope=termui_cast_protocol
            --scope=termui_cast_server
            --scope=termui_caster_cli
            --scope=termui_cast_client_core
          )
          if [ "$IS_PRERELEASE" = "true" ]; then
            MELOS_ARGS+=(--prerelease)
          fi
          if [ "$IS_GRADUATE" = "true" ]; then
            MELOS_ARGS+=(--graduate)
          fi
          if [ -n "$MANUAL_VERSION" ]; then
            MELOS_ARGS+=("--manual-version=fterm:${MANUAL_VERSION}")
          fi

          dart --packages=.dart_tool/package_config.json "$MELOS_BIN" "${MELOS_ARGS[@]}"

          if [ -z "$(git status --porcelain -- apps/)" ]; then
            echo "::error::Melos did not bump any packages under apps/. Check that apps/ has new Conventional Commits since the last release tag (or pass manual_version)."
            exit 1
          fi

          # If only termui_cast_server (a dev_dependency of fterm) had commits,
          # also bump fterm so apps/fterm/pubspec.yaml advances for the release tag.
          if git diff --quiet -- apps/fterm/pubspec.yaml; then
            cur_ver="$(sed -n 's/^version:[[:space:]]*\([^[:space:]#]*\).*/\1/p' apps/fterm/pubspec.yaml | head -n 1)"
            if [ "$IS_PRERELEASE" = "true" ]; then
              if [[ "$cur_ver" =~ ^([0-9]+\.[0-9]+\.[0-9]+)-([0-9A-Za-z-]+)\.([0-9]+)$ ]]; then
                bump_spec="${BASH_REMATCH[1]}-${BASH_REMATCH[2]}.$((BASH_REMATCH[3] + 1))"
              elif [[ "$cur_ver" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
                bump_spec="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.$((BASH_REMATCH[3] + 1))-dev.0"
              else
                bump_spec="patch"
              fi
            else
              bump_spec="patch"
            fi
            dart --packages=.dart_tool/package_config.json "$MELOS_BIN" version \
              --yes \
              --all \
              --no-git-tag-version \
              --no-git-commit-version \
              --scope=fterm \
              "--manual-version=fterm:${bump_spec}"
          fi

          restore_workspace_manifest
          trap - EXIT

          FTERM_VERSION="$(sed -n 's/^version:[[:space:]]*\([^[:space:]#+]*\).*/\1/p' apps/fterm/pubspec.yaml | head -n 1)"
          if [[ ! "$FTERM_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Invalid bumped fterm version '$FTERM_VERSION' in apps/fterm/pubspec.yaml."
            exit 1
          fi

          PACKAGE_LIST="$(
            for pubspec in \
              apps/fterm/pubspec.yaml \
              apps/termui_cast/protocol/pubspec.yaml \
              apps/termui_cast/server/pubspec.yaml \
              apps/termui_cast/caster_cli/pubspec.yaml \
              apps/termui_cast/client_core/pubspec.yaml; do
              if ! git diff --quiet -- "$pubspec"; then
                pkg_name="$(sed -n 's/^name:[[:space:]]*\([^[:space:]#]*\).*/\1/p' "$pubspec" | head -n 1)"
                pkg_ver="$(sed -n 's/^version:[[:space:]]*\([^[:space:]#]*\).*/\1/p' "$pubspec" | head -n 1)"
                printf ' - %s@%s\n' "$pkg_name" "$pkg_ver"
              fi
            done
          )"

          git add apps/
          if [ -f CHANGELOG.md ]; then
            git add CHANGELOG.md
          fi

          PR_TITLE="chore(fterm-release): release fterm v${FTERM_VERSION}"
          git commit -m "$(printf '%s\n\n%s\n' "$PR_TITLE" "$PACKAGE_LIST")"

          PUSH_TOKEN="${PAT_TOKEN:-$DEFAULT_TOKEN}"
          AUTH_HEADER="$(printf 'x-access-token:%s' "$PUSH_TOKEN" | base64 -w 0)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${AUTH_HEADER}" \
            push --force origin "HEAD:refs/heads/${RELEASE_BRANCH}"

          WHATS_NEW_REMINDER="$(python3 - "$FTERM_VERSION" <<'PY'
          import pathlib, re, sys

          target = sys.argv[1]
          target_match = re.match(r'^(\d+)\.(\d+)\.', target)
          catalog = pathlib.Path("apps/fterm/lib/src/ui/whats_new_catalog.dart")
          current = None
          if catalog.is_file():
              m = re.search(
                  r"const\s+String\s+whatsNewContentVersion\s*=\s*'([^']+)'",
                  catalog.read_text(encoding="utf-8"),
              )
              if m:
                  current = m.group(1)

          cur_match = re.match(r'^(\d+)\.(\d+)\.', current or '')
          stale = True
          if target_match and cur_match:
              target_mm = (int(target_match.group(1)), int(target_match.group(2)))
              cur_mm = (int(cur_match.group(1)), int(cur_match.group(2)))
              stale = target_mm > cur_mm

          if stale:
              stamped = f"`v{current}`" if current else "missing"
              print(
                  f"> [!WARNING]\n"
                  f"> **What's New cards need a refresh before merging**: "
                  f"`apps/fterm/lib/src/ui/whats_new_catalog.dart` is still stamped {stamped} "
                  f"while this release bumps `fterm` to `v{target}`.\n"
                  f"> - [ ] Update `whatsNewHighlights` and bump `whatsNewContentVersion` in "
                  f"`apps/fterm/lib/src/ui/whats_new_catalog.dart` (and update "
                  f"`apps/fterm/test/fterm_whats_new_test.dart`)."
              )
          PY
          )"

          {
            if [ -n "$WHATS_NEW_REMINDER" ]; then
              printf '%s\n\n' "$WHATS_NEW_REMINDER"
            fi
            printf '## Summary\n\n'
            printf 'Bumps `fterm` to `v%s` and updates `CHANGELOG.md` files via Melos:\n\n' "$FTERM_VERSION"
            printf '%s\n\n' "$PACKAGE_LIST"
            printf 'Merging this PR into `main` automatically starts **Release fterm** (`release-fterm.yml`) to build desktop and CLI bundles and publish `fterm-v%s`.\n' "$FTERM_VERSION"
            if [ -f apps/fterm/CHANGELOG.md ]; then
              NOTES="$(awk -v ver="$FTERM_VERSION" '
                $0 == "## " ver { found = 1; next }
                found && /^## / { exit }
                found { print }
              ' apps/fterm/CHANGELOG.md)"
              if [ -n "$NOTES" ]; then
                printf '\n## `fterm` %s Changelog\n\n%s\n' "$FTERM_VERSION" "$NOTES"
              fi
            fi
          } > pr-body.md

          EXISTING_PR="$(GH_TOKEN="$PUSH_TOKEN" gh pr list --head "$RELEASE_BRANCH" --base main --state open --json number --jq '.[0].number // empty')"
          if [ -n "$EXISTING_PR" ]; then
            GH_TOKEN="$PUSH_TOKEN" gh pr edit "$EXISTING_PR" --title "$PR_TITLE" --body-file pr-body.md
          else
            GH_TOKEN="$PUSH_TOKEN" gh pr create --base main --head "$RELEASE_BRANCH" --title "$PR_TITLE" --body-file pr-body.md
          fi
          rm -f pr-body.md
        env:
          IS_PRERELEASE: ${{ inputs.prerelease }}
          IS_GRADUATE: ${{ inputs.graduate }}
          MANUAL_VERSION: ${{ inputs.manual_version }}
          PAT_TOKEN: ${{ secrets.MY_PAT }}
          DEFAULT_TOKEN: ${{ secrets.GITHUB_TOKEN }}
