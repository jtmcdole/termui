name: Format and Analyze

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    name: Format and Analyze
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          cache: true

      - name: Install ALSA library
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev

      - name: Install dependencies
        run: flutter pub get

      - name: Bootstrap workspace
        run: dart run melos bootstrap

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Ban explicit dynamic types and casts
        run: |
          if git grep -n -E '<dynamic>|,[[:space:]]*dynamic>|(^|[^[:alnum:]_])as[[:space:]]+dynamic([^[:alnum:]_]|$)' -- ':(glob)packages/**/*.dart' ':(glob)apps/**/*.dart'; then
            echo "::error::Explicit dynamic type arguments or casts are banned. Use Object? or concrete types."
            exit 1
          fi

      - name: Analyze project source
        run: dart analyze --fatal-infos
