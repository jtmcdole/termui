name: Format and Analyze

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Format and Analyze
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install ALSA library
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev

      - name: Install Melos
        run: dart pub global activate melos

      - name: Bootstrap workspace
        run: melos bootstrap

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Ban explicit dynamic types and casts
        run: |
          if git grep -n -E '<dynamic>|,[[:space:]]*dynamic>|(^|[^[:alnum:]_])as[[:space:]]+dynamic([^[:alnum:]_]|$)' -- ':(glob)packages/**/*.dart'; then
            echo "::error::Explicit dynamic type arguments or casts are banned. Use Object? or concrete types."
            exit 1
          fi

      - name: Analyze project source
        run: dart analyze --fatal-infos
