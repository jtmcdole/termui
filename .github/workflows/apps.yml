name: Apps Build and Test

on:
  push:
    branches: [ main ]
    paths:
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'analysis_options.yaml'
      - '.github/actions/setup-soloud/**'
      - '.github/workflows/apps.yml'
      - 'apps/**'
      - 'packages/pty2/**'
      - 'packages/termui/**'
      - 'packages/termui_audio/**'
      - 'packages/termui_audio_flutter/**'
      - 'packages/termui_flutter/**'
      - 'packages/termui_pty/**'
      - 'packages/termui_recorder/**'
      - 'packages/termui_test/**'
  pull_request:
    branches: [ main ]
    paths:
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'analysis_options.yaml'
      - '.github/actions/setup-soloud/**'
      - '.github/workflows/apps.yml'
      - 'apps/**'
      - 'packages/pty2/**'
      - 'packages/termui/**'
      - 'packages/termui_audio/**'
      - 'packages/termui_audio_flutter/**'
      - 'packages/termui_flutter/**'
      - 'packages/termui_pty/**'
      - 'packages/termui_recorder/**'
      - 'packages/termui_test/**'

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test-apps:
    name: Apps (${{ matrix.suite }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        suite: [cast, fterm]
        include:
          - os: ubuntu-latest
            suite: web

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configure Windows Defender exclusions
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Add-MpPreference -ExclusionPath "D:\"
          Add-MpPreference -ExclusionProcess "tar.exe", "unzip.exe", "zstd.exe", "dart.exe", "flutter_tester.exe", "cl.exe", "link.exe", "OpenConsole.exe"

      - name: Install ALSA library (Linux)
        if: runner.os == 'Linux' && matrix.suite == 'fterm'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libasound2-dev

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          cache: true
          pub-cache: false
          cache-path: ${{ runner.os == 'Windows' && 'D:/flutter-sdk/:channel:-:version:-:arch:' || '' }}
          cache-key: ${{ runner.os == 'Windows' && 'flutter-:os:-:channel:-:version:-:arch:-:hash:-d1' || '' }}
          pub-cache-path: ${{ runner.os == 'Windows' && 'D:/pub-cache' || 'default' }}

      - name: Install workspace dependencies
        run: flutter pub get

      - name: Set up SoLoud CMake cache
        if: matrix.suite == 'fterm'
        uses: ./.github/actions/setup-soloud

      - name: Cache Windows ConPTY sidecar
        if: runner.os == 'Windows' && (matrix.suite == 'cast' || matrix.suite == 'fterm')
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/AppData/Local/pty2/conpty
          key: ${{ runner.os }}-conpty-${{ hashFiles('packages/pty2/lib/src/impl/conpty_bundle.dart') }}

      - name: Test termui_cast_protocol
        if: matrix.suite == 'cast'
        working-directory: apps/termui_cast/protocol
        run: dart test

      - name: Test termui_cast_server
        if: matrix.suite == 'cast'
        working-directory: apps/termui_cast/server
        run: dart test

      - name: Test termui_caster_cli
        if: matrix.suite == 'cast'
        working-directory: apps/termui_cast/caster_cli
        run: dart test

      - name: Test termui_cast_client_core
        if: matrix.suite == 'cast'
        working-directory: apps/termui_cast/client_core
        run: dart test

      - name: Test fterm
        if: matrix.suite == 'fterm'
        working-directory: apps/fterm
        shell: bash
        run: |
          extra_args=()
          if [ "${UPDATE_GOLDENS:-false}" = "true" ]; then
            extra_args+=(--update-goldens)
          fi
          flutter test --no-pub "${extra_args[@]}"

      - name: Upload Golden Failures
        if: failure() && runner.os == 'Linux' && matrix.suite == 'fterm'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fterm-golden-failures
          path: apps/fterm/test/failures/*.png
          if-no-files-found: ignore

      - name: Build WASM web viewer (no CDN)
        if: matrix.suite == 'web'
        working-directory: apps/fterm
        run: |
          BUILD_DATE="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          flutter build web --wasm --no-web-resources-cdn --dart-define="FTERM_BUILD_DATE=${BUILD_DATE}"
          grep -q '"useLocalCanvasKit":true' build/web/flutter_bootstrap.js
