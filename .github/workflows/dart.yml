name: Build and Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  changes:
    name: Detect Package Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      run: ${{ steps.filter.outputs.run }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - name: Check package-relevant paths
        id: filter
        uses: ./.github/actions/detect-changes
        with:
          label: Build and Test CI
          paths: |
            pubspec.yaml
            pubspec.lock
            analysis_options.yaml
            .github/actions/detect-changes/
            .github/actions/setup-soloud/
            .github/workflows/dart.yml
            packages/

  test:
    name: Build and Test (${{ matrix.os }}, ${{ matrix.suite }})
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        suite: [dart, flutter]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configure Windows Defender exclusions
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Add-MpPreference -ExclusionPath "D:\"
          Add-MpPreference -ExclusionProcess "tar.exe", "unzip.exe", "zstd.exe", "dart.exe", "flutter_tester.exe", "cl.exe", "link.exe"

      - name: Install ALSA library (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev

      - name: Set up Dart (pure Dart lane)
        if: matrix.suite == 'dart'
        uses: dart-lang/setup-dart@2286a0c042b44434fe26d292bbce8d34f7ec662b # v1.8.2
        with:
          sdk: stable

      - name: Bootstrap pure Dart workspace
        if: matrix.suite == 'dart'
        shell: pwsh
        run: |
          if ($IsWindows) {
            "PUB_CACHE=D:\pub-cache" | Out-File -FilePath $env:GITHUB_ENV -Append
            $env:PUB_CACHE = "D:\pub-cache"
          }
          Remove-Item -Recurse -Force packages/termui_flutter, packages/termui_audio_flutter, packages/termui_tinpot/example, apps
          Get-ChildItem -Path packages/termui_audio/example -Force |
            Where-Object { $_.Name -ne 'assets' } |
            Remove-Item -Recurse -Force
          $pubspec = Get-Content pubspec.yaml -Raw
          $pubspec = [regex]::Replace($pubspec, '(?ms)^dependencies:\r?\n\s+flutter:\r?\n\s+sdk:\s*flutter\r?\n+', '')
          $pubspec = [regex]::Replace($pubspec, '(?m)^\s*-\s+(packages/(termui_flutter|termui_audio_flutter|termui_audio/example|termui_tinpot/example)(/[^\r\n]*)?|apps/[^\r\n]*)\r?\n', '')
          Set-Content -Path pubspec.yaml -Value $pubspec -NoNewline
          dart pub get

      - name: Set up Flutter (Flutter lane)
        if: matrix.suite == 'flutter'
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          cache: true
          pub-cache: false
          cache-path: ${{ runner.os == 'Windows' && 'D:/flutter-sdk/:channel:-:version:-:arch:' || '' }}
          cache-key: ${{ runner.os == 'Windows' && 'flutter-:os:-:channel:-:version:-:arch:-:hash:-d1' || '' }}
          pub-cache-path: ${{ runner.os == 'Windows' && 'D:/pub-cache' || 'default' }}

      - name: Bootstrap Flutter workspace
        if: matrix.suite == 'flutter'
        run: flutter pub get

      - name: Set up SoLoud CMake cache
        uses: ./.github/actions/setup-soloud

      - name: Run ${{ matrix.suite }} unit tests
        shell: pwsh
        run: |
          if ($env:SUITE -eq 'flutter' -and $env:UPDATE_GOLDENS -eq 'true') {
            dart run melos exec -c 1 --flutter --dir-exists=test --ignore=fterm -- "flutter test --no-pub --reporter=expanded --update-goldens"
          } else {
            dart run melos run "test:$env:SUITE" --no-select
          }
        env:
          SUITE: ${{ matrix.suite }}

      - name: Upload Golden Failures
        if: failure() && matrix.os == 'ubuntu-latest' && matrix.suite == 'flutter'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: flutter-golden-failures
          path: packages/**/test/failures/*.png
          if-no-files-found: ignore

  build-and-test-gate:
    name: Build and Test
    needs: [changes, test]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Evaluate Build and Test CI result
        shell: bash
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          TEST_RESULT: ${{ needs.test.result }}
        run: |
          set -euo pipefail

          if [ "$CHANGES_RESULT" != "success" ]; then
            echo "::error::changes job ended with status: $CHANGES_RESULT"
            exit 1
          fi

          if [ "$TEST_RESULT" != "success" ] && [ "$TEST_RESULT" != "skipped" ]; then
            echo "::error::test job ended with status: $TEST_RESULT"
            exit 1
          fi

          echo "Build and Test gate passed (changes=$CHANGES_RESULT, test=$TEST_RESULT)."
